name: Publish NuGet package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version to publish (for example, 1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine package version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version || github.event.release.tag_name }}"
          version="${version#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test src/EtsyApiSharp.sln --configuration Release

      - name: Pack
        run: dotnet pack src/EtsyApiSharp/EtsyApiSharp.csproj --configuration Release -p:Version=${{ steps.version.outputs.value }} --output ./artifacts

      - name: Publish package
        run: dotnet nuget push './artifacts/*.nupkg' --api-key '${{ secrets.NUGET_API_KEY }}' --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish symbols
        run: dotnet nuget push './artifacts/*.snupkg' --api-key '${{ secrets.NUGET_API_KEY }}' --source https://api.nuget.org/v3/index.json --skip-duplicate
